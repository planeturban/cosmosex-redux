# nginx in front of the CosmosEx app (docs/manual.md, "Web server").
#
# The network reaches nginx on port 80; the app's own web server (civetweb,
# in the cosmosex program) listens on 127.0.0.1:8081 only and answers
# everything: pages, API, login. nginx adds what the app's server doesn't
# do: connections that stay open between requests, compression, and a queue
# in front of the app.
#
# Nothing is kept on the card: no access log, errors to /run (RAM), no
# buffering to files (uploads and downloads pass straight through, however
# big).

user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /run/nginx/error.log warn;

events {
	worker_connections 256;
}

http {
	access_log off;
	server_tokens off;
	default_type application/octet-stream;

	# temporary files (hardly used, see proxy_*_buffering below): RAM
	client_body_temp_path /run/nginx/body;
	proxy_temp_path /run/nginx/proxy;

	keepalive_timeout 75s;
	keepalive_requests 10000;

	# uploads: disk images of any size; never refused or stored here
	client_max_body_size 0;

	# text answers compressed (the 2 MB floppy list, the pages' scripts)
	gzip on;
	gzip_comp_level 2;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_vary on;
	gzip_types application/json application/javascript text/javascript text/css text/plain image/svg+xml;

	server {
		listen 80 default_server;
		server_name _;

		location / {
			proxy_pass http://127.0.0.1:8081;
			# 1.1 for chunked answers (the Files page's streamed reads); the
			# app closes its connection after every answer
			proxy_http_version 1.1;
			proxy_set_header Connection "close";
			proxy_set_header Host $http_host;
			# The address of whoever asks, for the app's login (requests from
			# the CosmosEx itself need none). Always set here, so one sent by
			# a client is replaced.
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $remote_addr;

			# straight through, both ways: progress bars stay true, the
			# screen stream isn't held back, nothing is written to files
			proxy_request_buffering off;
			proxy_buffering off;
			# ... in big pieces (the default 4 to 8 KB at a time made a download
			# through here several times slower than from the app)
			proxy_buffer_size 256k;
			proxy_buffers 4 256k;
			client_body_buffer_size 256k;

			proxy_connect_timeout 5s;
			# long jobs answer when they're done (backup, copy, update upload)
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
			send_timeout 3600s;
		}
	}
}
