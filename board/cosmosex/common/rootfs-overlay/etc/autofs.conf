# CosmosEx shared drive automounter (see /usr/libexec/ce-shared-mount)
[ autofs ]
master_map_name = /etc/auto.master
# Unmount the share after 5 minutes without use
timeout = 300
# After a failed mount (server down), wait 30 s before trying again, so the
# Atari isn't held up by a mount attempt on every access
negative_timeout = 30
# Give up on a mount attempt after 20 s
mount_wait = 20
browse_mode = no
logging = none
